# =====================================================================
# trade-service 配置(feat/ms-trade)
# 端口:8083
# 数据库:PostgreSQL @ localhost:5432 / welove_shop_search / schema=trade_svc
# 注册中心:Nacos @ localhost:8848
# 跨服务:Feign 调 product-service + user-service
# =====================================================================
server:
  port: 8083

spring:
  application:
    name: trade-service
  profiles:
    # 本地默认 dev(读取 application-dev.yml,文件不进 git);
    # 部署时通过环境变量覆盖:SPRING_PROFILES_ACTIVE=prod
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ---------- Nacos 配置中心(Modern 接入方式,Spring Cloud 2023+) ----------
  # SCA 自带 NacosConfigDataLoader,通过 spring.config.import 加载。
  # optional:nacos: 表示 Nacos 连不上时启动不阻塞,降级使用本地 application*.yml。
  config:
    import:
      # 共享配置(所有服务共用:JWT / Feign / 日志级别)
      - optional:nacos:nacos-common.yml?group=COMMON_GROUP&refreshEnabled=true
      # 本服务私有配置(支付宝 / 订单超时扫描)
      - optional:nacos:nacos-trade-service.yml?group=TRADE_GROUP&refreshEnabled=true

  cloud:
    nacos:
      # 服务发现
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:public}
        fail-fast: false
      # 配置中心(共享 spring.config.import 加载,这里只声明公共属性)
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml
        refresh-enabled: true

  # ---------- PostgreSQL ----------
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/welove_shop_search?currentSchema=trade_svc&stringtype=unspecified
    username: root
    password: 12345678
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: trade-svc-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ---------- Flyway ----------
  flyway:
    enabled: true
    baseline-on-migrate: true
    default-schema: trade_svc
    schemas: trade_svc
    locations: classpath:db/migration
    validate-on-migrate: true

# ---------- MyBatis-Plus ----------
mybatis-plus:
  global-config:
    db-config:
      id-type: auto                              # 与 PG IDENTITY 对齐
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 开发期打印 SQL

# ---------- JWT(与 user/product 共享密钥,跨服务 token 通用) ----------
jwt:
  secret: ${JWT_SECRET:weloveShop-jwt-secret-key-must-be-at-least-32-characters-for-hs256-algorithm}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}
  header: Authorization
  prefix: "Bearer "

# ---------- Feign 客户端(超时 + 日志) ----------
feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000
        loggerLevel: BASIC
  compression:
    request:
      enabled: true
    response:
      enabled: true

# ---------- 业务开关 ----------
trade-service:
  order:
    pay-timeout-minutes: 10                     # 订单超时未支付分钟数(与 monolith 一致)
    timeout-scan-cron: "0 * * * * ?"            # 定时扫描 cron:每分钟第 0 秒

# ---------- 支付宝支付 ----------
# 沙箱环境(开发期),上线后切换 gateway / app-id / 公私钥
# ALIPAY_ENABLED=false 时 PaymentService 走降级"模拟支付"路径,便于本地无配置时跑通
alipay:
  enabled: ${ALIPAY_ENABLED:false}
  app-id: ${ALIPAY_APP_ID:2021000123456789}
  app-private-key: ${ALIPAY_APP_PRIVATE_KEY:}
  alipay-public-key: ${ALIPAY_ALIPAY_PUBLIC_KEY:}
  gateway-url: ${ALIPAY_GATEWAY:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
  # wap=手机 H5 支付(默认),page=电脑网站支付兼容模式
  pay-mode: ${ALIPAY_PAY_MODE:wap}
  protocol: https
  sign-type: RSA2
  charset: UTF-8
  # 回调地址必须公网 HTTPS,内网穿透方案见 docs/plan/alipay-sandbox-payment.md §6
  notify-url: ${ALIPAY_NOTIFY_URL:https://pay-dev.example.com/api/trade/alipay/notify}
  return-url: ${ALIPAY_RETURN_URL:https://pay-dev.example.com/api/trade/alipay/return}
  quit-url: ${ALIPAY_QUIT_URL:http://localhost:5173/#/pages/order-list/order-list}
  # 支付完成后同步回跳到前端 H5 结果页,前端会轮询异步通知更新后的订单状态
  h5-return-url: ${ALIPAY_H5_RETURN_URL:http://localhost:5173/#/pages/payment/result}

# ---------- 管理端点 ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info,env
  endpoint:
    health:
      show-details: always
